# Monthly version updates. Every pull request runs CI, including a fresh
# Home Assistant install, so a bump that conflicts with Home Assistant's
# constraints or Python version fails there instead of on a user's volume.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # The base image's Python runs Home Assistant's venv, so it moves only
    # when Home Assistant supports the next Python.
    ignore:
      - dependency-name: python
        versions: [">=3.15"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # paho-mqtt is pinned by Home Assistant itself (package_constraints.txt and
    # the MQTT integration), and requirements.txt is installed under those
    # constraints: it moves when Home Assistant moves it, never ahead of it
    # (2.2.0 could not install on any supported Home Assistant).
    ignore:
      - dependency-name: paho-mqtt
