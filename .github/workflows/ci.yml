name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Python
        run: python -m compileall -q -f entrypoint.py run.py backupkit.py jsonio.py logbuffer.py test_components.py tests custom_components
      - name: JSON
        run: python -c "import json; [json.load(open(f)) for f in ('registry.json', 'custom_components/integration_manager/manifest.json')]"
      - name: JavaScript
        run: for f in custom_components/integration_manager/static/*.js; do node --check "$f"; done
      - name: Page behaviour under node
        # runs the page's own field()/collect() under node: the container the unit tests
        # run in has none, so these skip there and are covered here instead
        run: python -m unittest tests.test_camp_config_js tests.test_log_pages_js tests.test_r11_pages_js tests.test_r12_web_js tests.test_r13_pages_js -v
      - name: Shell
        run: sh -n verify.sh
      - name: Compose files
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.dev.yml config -q

  boot:
    name: ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            name: Build, boot and discovery schemas
            runner: ubuntu-latest
          - arch: arm64
            name: Boot on arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HRI_NAME: hri-ci
      HRI_PORT: "8087"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: hass-remote-integration:local
          build-args: HRI_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}
      - name: Boot on a fresh volume (installs Home Assistant)
        run: sh verify.sh start
      - name: Manager API is up without restarts
        run: |
          curl -fsS http://127.0.0.1:8087/api/status | python3 -c "import json, sys; s = json.load(sys.stdin); print('Home Assistant', s['ha_version'])"
          test "$(docker inspect -f '{{.RestartCount}}' hri-ci)" = "0"
      - name: Discovery payloads against the MQTT schemas
        run: sh verify.sh test
      - name: Unit tests
        run: sh verify.sh unit
      - name: Container log
        if: always()
        run: docker logs hri-ci 2>&1 | tail -n 200
