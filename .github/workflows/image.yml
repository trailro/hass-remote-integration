name: Image

# Publishes the image for amd64 and arm64 to GitHub Container Registry and Docker Hub:
# ghcr.io/<owner>/<repo> and docker.io/trailro26/hass-remote-integration, each
# :<version>, :<major>.<minor> when it is the highest stable release of that series,
# plus :latest when a published, non-prerelease release carries the highest stable tag.  One build pushes the same digest to
# both.  Docker Hub needs the DOCKERHUB_TOKEN secret, a Docker Hub access token
# of trailro26 with Read, Write & Delete (the overview update needs more than
# Read & Write); without it the run fails before building.  Runs when a release
# is published; "Run workflow" publishes an existing tag again (e.g. after a
# registry cleanup) and never moves :latest.
#
# The Docker Hub overview follows the newest stable release: the README up to
# "Everyday operation" (Docker Hub takes at most 25000 bytes), with its links
# pointing at GitHub and a link to the full README.  "Run workflow" with
# readme_only updates only the overview, from that tag when it is the newest
# stable one, without building or pushing an image.
on:
  release:
    types: [published, released]  # released: a pre-release promoted to a full release
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.9.0)"
        required: true
      readme_only:
        description: "Only update the Docker Hub overview (no image build)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    # a stable release fires both published and released: it is built once, on released; a pre-release is
    # built on published, and again (then possibly as :latest) on released when it is promoted
    if: (github.event_name != 'release' && !inputs.readme_only) || github.event.action == 'released' || github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DOCKERHUB_USER: trailro26
      DOCKERHUB_IMAGE: docker.io/trailro26/hass-remote-integration
    steps:
      - name: Docker Hub token present
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::the DOCKERHUB_TOKEN secret is not set: add a Docker Hub access token (Read, Write & Delete) as a repository secret, then run this workflow again"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - id: commit
        name: Commit of the tag
        # github.sha is the dispatching branch's head on a manual run, not the tag that is built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: latest
        name: Is this the newest stable release, and the newest of its X.Y series?
        # from the releases, not from the event or the tags: a manual run knows nothing of the release it builds, and
        # a pre-release can carry a plain vX.Y.Z tag (then a stable patch published after it would not be "newest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease,isDraft \
            | python3 -c 'import json, re, sys; print("\n".join(r["tagName"] for r in json.load(sys.stdin) if not r["isPrerelease"] and not r["isDraft"] and re.fullmatch(r"v\d+\.\d+\.\d+", r["tagName"])))' \
            | sort -V)
          newest=$(printf '%s\n' "$stable" | tail -n1)
          series=$(printf '%s\n' "$stable" | { grep -F "${TAG%.*}." || true; } | tail -n1)  # the shell runs with pipefail
          # :latest only from a release event (a manual run publishes a tag again and never moves it)
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$TAG" = "$newest" ]; then
            echo "enable=true" >> "$GITHUB_OUTPUT"
          else
            echo "enable=false" >> "$GITHUB_OUTPUT"
          fi
          # :X.Y only for the highest stable release of that series: an older patch published again must not take it back
          if [ -n "$series" ] && [ "$TAG" = "$series" ]; then
            echo "minor=true" >> "$GITHUB_OUTPUT"
          else
            echo "minor=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag $TAG, newest stable $newest, newest of ${TAG%.*}: ${series:-none}"
          cat "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          context: git   # labels from the checked-out tag, not from the default branch of a manual run
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ steps.latest.outputs.minor }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HRI_BUILD=${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

  compose:
    # releases/latest/download/docker-compose.yml then always serves the compose
    # file of the newest release (the README and install instructions use it)
    name: Attach docker-compose.yml to the release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" docker-compose.yml --clobber --repo "$GITHUB_REPOSITORY"

  dockerhub-overview:
    name: Docker Hub overview
    needs: image
    # after a successful image build, or on its own with readme_only
    if: always() && (needs.image.result == 'success' || (needs.image.result == 'skipped' && inputs.readme_only))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Docker Hub token present
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::the DOCKERHUB_TOKEN secret is not set"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - id: newest
        name: Is this the newest stable release?
        # from the releases (see the image job): a manual run on a pre-release is not stable either
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease,isDraft \
            | python3 -c 'import json, re, sys; print("\n".join(r["tagName"] for r in json.load(sys.stdin) if not r["isPrerelease"] and not r["isDraft"] and re.fullmatch(r"v\d+\.\d+\.\d+", r["tagName"])))' \
            | sort -V | tail -n1)
          if [ "$TAG" = "$newest" ]; then
            echo "enable=true" >> "$GITHUB_OUTPUT"
          else
            echo "enable=false" >> "$GITHUB_OUTPUT"
            echo "tag $TAG is not the newest stable release ($newest): the overview stays as it is"
          fi
      - name: Build the overview
        if: steps.newest.outputs.enable == 'true'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/hub"
          out="$RUNNER_TEMP/hub/README.md"
          # the README already ends the part it keeps with a --- line: the link goes right under it
          awk '/^## Everyday operation/{exit} {print}' README.md \
            | sed -E "s#\]\(\##](${REPO_URL}/blob/${TAG}/README.md\##g; s#\]\((docs/|SECURITY\.md|LICENSE)#](${REPO_URL}/blob/${TAG}/\1#g" > "$out"
          printf 'The rest of the documentation (everyday operation, configuration, troubleshooting, and links to the MQTT, security, API and file references in docs/) is in the [full README on GitHub](%s/blob/%s/README.md#everyday-operation).\n' "$REPO_URL" "$TAG" >> "$out"
          wc -c "$out"
          # Docker Hub keeps at most 25000 bytes and the action cuts the rest with only a warning: the first thing
          # to go would be the link above, to everything past this part.  tests/test_hub_overview.py runs this
          # same script on every pull request, so this refusal is the last line, not the first.
          size=$(wc -c < "$out")
          if [ "$size" -gt 25000 ]; then
            echo "::error::the Docker Hub overview is $size bytes, over the 25000 Docker Hub keeps: shorten README.md above '## Everyday operation' or move a section below it"
            exit 1
          fi
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        if: steps.newest.outputs.enable == 'true'
        with:
          username: trailro26
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: trailro26/hass-remote-integration
          short-description: Run one Home Assistant integration in its own container, mirrored to your HA over MQTT
          readme-filepath: ${{ runner.temp }}/hub/README.md

  app-version:
    # Home Assistant OS offers an app update as soon as app/config.yaml on the default branch names a new version,
    # and then pulls that tag: the version moves here, after the image is pushed, and never in the release PR
    # (the update would be offered minutes before the image could be pulled).  Newest stable releases only, the
    # overview's condition.
    name: App version on the default branch
    needs: image
    if: needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the one commit below
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set app/config.yaml version
        # newest stable from the releases (see the image job), and never lower than what the file names already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease,isDraft \
            | python3 -c 'import json, re, sys; print("\n".join(r["tagName"] for r in json.load(sys.stdin) if not r["isPrerelease"] and not r["isDraft"] and re.fullmatch(r"v\d+\.\d+\.\d+", r["tagName"])))' \
            | sort -V | tail -n1)
          if [ "$TAG" != "$newest" ]; then
            echo "tag $TAG is not the newest stable release (${newest:-none}): the app version stays as it is"
            exit 0
          fi
          version="${TAG#v}"
          current=$(sed -nE 's/^version: "?([^"]*)"?$/\1/p' app/config.yaml)
          if [ "$current" = "$version" ]; then
            echo "app/config.yaml already names $version"
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" = "$current" ]; then
            echo "app/config.yaml names $current, newer than $version: the app version stays as it is"
            exit 0
          fi
          sed -i -E "s/^version: .*/version: \"$version\"/" app/config.yaml
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "app: version $version, the image of $TAG is published" -- app/config.yaml
          git pull -q --rebase origin "$BRANCH"   # a merge since the checkout
          git push origin "HEAD:$BRANCH"
