name: Image

# Publishes the image to GitHub Container Registry for amd64 and arm64:
# ghcr.io/<owner>/<repo>:<version> and :<major>.<minor>, plus :latest when a
# published, non-prerelease release carries the highest stable tag.  Runs when
# a release is published; "Run workflow" publishes an existing tag again (e.g.
# after a registry cleanup) and never moves :latest.
on:
  release:
    types: [published, released]  # released: a pre-release promoted to a full release
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.9.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    # a stable release fires both published and released: it is built once, on released; a pre-release is
    # built on published, and again (then possibly as :latest) on released when it is promoted
    if: github.event_name != 'release' || github.event.action == 'released' || github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0   # the tags, to tell whether this is the newest stable release
          persist-credentials: false
      - id: commit
        name: Commit of the tag
        # github.sha is the dispatching branch's head on a manual run, not the tag that is built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: latest
        name: Is this the newest stable release?
        env:
          PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease }}
        run: |
          newest=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$PRERELEASE" != true ] && [ "$TAG" = "$newest" ]; then
            echo "enable=true" >> "$GITHUB_OUTPUT"
          else
            echo "enable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag $TAG, newest stable $newest, latest: $(tail -n1 "$GITHUB_OUTPUT")"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          context: git   # labels from the checked-out tag, not from the default branch of a manual run
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HRI_BUILD=${{ steps.commit.outputs.sha }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

  compose:
    # releases/latest/download/docker-compose.yml then always serves the compose
    # file of the newest release (the README and install instructions use it)
    name: Attach docker-compose.yml to the release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" docker-compose.yml --clobber --repo "$GITHUB_REPOSITORY"
