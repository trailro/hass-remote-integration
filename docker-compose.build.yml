# Build the image from this checkout instead of pulling the published one:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# (with -f, Compose no longer loads docker-compose.override.yml on its own: add it too)
# HRI_BUILD=$(git rev-parse HEAD) in front of that command shows the commit in the UI
services:
  hass-remote-integration:
    build:
      context: .
      args:
        HRI_BUILD: "${HRI_BUILD:-local}"
    image: hass-remote-integration:local
