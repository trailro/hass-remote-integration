# One container per integration: give each its own name, port and volume
# (HRI_NAME, HRI_PORT; put them in a .env file next to this one).
# Local specifics such as the Docker network your MQTT broker is on or a USB
# device belong in a docker-compose.override.yml (Compose loads it
# automatically; see README).
# The image comes from GitHub Container Registry (amd64 and arm64); pin a
# release with HRI_VERSION (e.g. 0.10.0), or build it from this checkout with
# docker-compose.build.yml.
services:
  hass-remote-integration:
    image: ghcr.io/trailro/hass-remote-integration:${HRI_VERSION:-latest}
    container_name: ${HRI_NAME:-hass-remote-integration}
    restart: unless-stopped
    ports:
      - "${HRI_PORT:-8087}:${HRI_PORT:-8087}"
    volumes:
      - config:/config
    environment:
      TZ: "${TZ:-UTC}"
      HRI_PORT: "${HRI_PORT:-8087}"
      HRI_TRACEMALLOC: "${HRI_TRACEMALLOC:-}"   # e.g. 25: opt-in allocation tracing for /api/diag/memory
      HRI_PASSWORD: "${HRI_PASSWORD:-}"         # optional: a password for the web UI and API (empty: no login)
      HRI_PASSWORD_FILE: "${HRI_PASSWORD_FILE:-}"  # optional: read the password from this file instead (e.g. a Docker secret)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # a serial-to-TCP bridge or a broker on the Docker host

volumes:
  config:
    name: ${HRI_NAME:-hass-remote-integration}   # keys are not interpolated by Compose; the name is
