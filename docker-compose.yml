# One container per integration: give each its own name, port and volume
# (HRI_NAME, HRI_PORT; put them in a .env file next to this one).
# Local specifics such as the Docker network your MQTT broker is on or a USB
# device belong in a docker-compose.override.yml (Compose loads it
# automatically; see README).
# The image comes from GitHub Container Registry or, with
# HRI_REGISTRY=docker.io/trailro26, from Docker Hub: the same image, tags and
# digest (amd64 and arm64). Pin a release with HRI_VERSION (e.g. 0.25.1), or
# build it from this checkout with docker-compose.build.yml.
services:
  hass-remote-integration:
    image: ${HRI_REGISTRY:-ghcr.io/trailro}/hass-remote-integration:${HRI_VERSION:-latest}
    container_name: ${HRI_NAME:-hass-remote-integration}
    restart: unless-stopped
    init: true                # signals reach the entrypoint and orphaned processes are reaped
    stop_grace_period: 240s   # Home Assistant saves its registries last: Docker's default 10 s kills it first (run.py's stop watchdog exits by ~235 s, inside it)
    ports:
      - "${HRI_PORT:-8087}:${HRI_PORT:-8087}"
    volumes:
      - config:/config
    environment:
      TZ: "${TZ:-UTC}"
      HRI_PORT: "${HRI_PORT:-8087}"
      HRI_TRACEMALLOC: "${HRI_TRACEMALLOC:-}"   # e.g. 25: opt-in allocation tracing for /api/diag/memory
      HRI_PASSWORD: "${HRI_PASSWORD:-}"         # optional: a password for the web UI and API (empty: no login)
      HRI_PASSWORD_FILE: "${HRI_PASSWORD_FILE:-}"  # optional: read the password from this file instead (e.g. a Docker secret)
      HRI_COOKIE_SECURE: "${HRI_COOKIE_SECURE:-}"  # 1: mark the session cookie Secure (behind a reverse proxy with TLS)
      HA_VERSION_LATEST: "${HA_VERSION_LATEST:-1}"  # 0: a fresh volume installs the image's default Home Assistant (HA_VERSION_DEFAULT) instead of the newest
      HRI_APT_PACKAGES: "${HRI_APT_PACKAGES:-}"     # e.g. "ffmpeg": Debian packages installed at boot, for what pip cannot install
      HRI_CALL_TIMEOUT: "${HRI_CALL_TIMEOUT:-60}"   # seconds a service call may take (over MQTT and from the Services page)
      HRI_DEBUG: "${HRI_DEBUG:-}"                   # 1: debug logging for the manager
      HRI_TRACE_IMPORT: "${HRI_TRACE_IMPORT:-}"     # diagnostics: log who imports these packages
    extra_hosts:
      - "host.docker.internal:host-gateway"   # a serial-to-TCP bridge or a broker on the Docker host

volumes:
  config:
    name: ${HRI_NAME:-hass-remote-integration}   # keys are not interpolated by Compose; the name is
